<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Era – Teacher Course Vote Count</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --glass-bg: rgba(255,255,255,0.10);
      --glass-border: rgba(255,255,255,0.18);
      --glass-blur: 18px;
      --accent: #e040fb;
      --accent2: #00e5ff;
      --text: #fff;
      --text-sub: rgba(255,255,255,0.6);
      --card-radius: 20px;
    }
    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(160deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%;
      filter: blur(90px); opacity: 0.22; pointer-events: none; z-index: 0;
    }
    body::before { width: 650px; height: 650px; background: radial-gradient(circle, #e040fb, transparent 70%); top: -180px; left: -180px; }
    body::after  { width: 500px; height: 500px; background: radial-gradient(circle, #00e5ff, transparent 70%); bottom: -120px; right: -120px; }

    header {
      position: relative; z-index: 10;
      display: flex; align-items: center; gap: 16px;
      padding: 22px 32px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-bottom: 1px solid var(--glass-border);
    }
    header img { height: 44px; object-fit: contain; }
    header .brand { display: flex; flex-direction: column; }
    header .brand .name { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.03em; }
    header .brand .sub  { font-size: 0.72rem; color: var(--text-sub); letter-spacing: 0.1em; margin-top: 2px; }

    main {
      position: relative; z-index: 5;
      max-width: 680px; margin: 0 auto;
      padding: 44px 20px 80px;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
    }

    /* Title card */
    .title-card {
      padding: 30px 28px 22px; margin-bottom: 22px; text-align: center;
    }
    .week-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--accent2); margin-bottom: 10px;
    }
    .title-card h1 { font-size: 1.75rem; font-weight: 800; line-height: 1.2; margin-bottom: 6px; }
    .title-card p  { font-size: 0.88rem; color: var(--text-sub); }

    /* Inner cards */
    .card { padding: 26px 24px; margin-bottom: 18px; }

    .field-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: 10px; display: block;
    }
    .field-label + .field-label,
    .pills + .field-label { margin-top: 20px; }

    /* Pills */
    .pills { display: flex; flex-wrap: wrap; gap: 10px; }
    .pill {
      flex: 1 1 0; min-width: 48px;
      padding: 12px 0; text-align: center;
      font-family: inherit; font-size: 0.95rem; font-weight: 700; color: #fff;
      border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.13);
      background: rgba(255,255,255,0.06);
      cursor: pointer; transition: border-color .16s, background .16s, transform .1s;
    }
    .pill:hover { border-color: rgba(224,64,251,0.5); background: rgba(224,64,251,0.08); }
    .pill.selected { border-color: var(--accent); background: rgba(224,64,251,0.2); color: var(--accent); }
    .pill.big { padding: 15px 0; font-size: 1.05rem; }
    .pill small { display: block; font-size: 0.65rem; font-weight: 400; color: var(--text-sub); margin-top: 3px; }
    .pill.selected small { color: rgba(224,64,251,0.8); }

    .class-badge {
      display: none; margin-top: 18px; padding: 12px 16px; border-radius: 12px;
      background: rgba(224,64,251,0.12); border: 1px solid rgba(224,64,251,0.4);
      font-weight: 700; font-size: 0.95rem; text-align: center; color: var(--accent);
    }

    /* Theme rows */
    .theme-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 11px 14px; border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,0.11);
      background: rgba(255,255,255,0.05);
      margin-bottom: 9px;
      transition: border-color .15s, background .15s;
    }
    .theme-row.has-votes {
      border-color: rgba(224,64,251,0.5);
      background: rgba(224,64,251,0.09);
    }
    .theme-names { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .theme-emoji { font-size: 1.3rem; flex-shrink: 0; }
    .theme-name  { font-size: 0.88rem; font-weight: 600; line-height: 1.3; }

    /* Stepper */
    .stepper { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .step-btn {
      width: 34px; height: 34px; border-radius: 9px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.09); color: #fff;
      font-size: 1.2rem; font-weight: 700; font-family: inherit;
      cursor: pointer; line-height: 1;
      transition: background .14s;
      display: flex; align-items: center; justify-content: center;
    }
    .step-btn:hover { background: rgba(224,64,251,0.25); }
    .num-input {
      width: 50px; height: 34px; text-align: center;
      background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
      border-radius: 9px; color: #fff; font-family: inherit;
      font-size: 1rem; font-weight: 700; outline: none;
      -moz-appearance: textfield;
    }
    .num-input::-webkit-outer-spin-button,
    .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .num-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.13); }

    /* Total */
    .total-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 14px; padding: 13px 16px; border-radius: 13px;
      background: rgba(255,255,255,0.07); border: 1px solid var(--glass-border);
      font-weight: 600; font-size: 0.9rem;
    }
    .total-num { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

    /* Submit */
    .submit-btn {
      width: 100%; margin-top: 20px; padding: 15px;
      border: none; border-radius: 13px;
      background: linear-gradient(135deg, var(--accent) 0%, #7b1fa2 100%);
      color: #fff; font-family: inherit; font-size: 0.95rem; font-weight: 700;
      letter-spacing: 0.05em; cursor: pointer;
      box-shadow: 0 4px 24px rgba(224,64,251,0.3);
      transition: opacity .2s, transform .12s, box-shadow .2s;
    }
    .submit-btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 8px 32px rgba(224,64,251,0.42); }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .status-msg { text-align: center; margin-top: 12px; min-height: 20px; font-size: 0.84rem; color: var(--accent2); }
    .status-msg.error { color: #ff6d6d; }

    /* Success */
    .success-banner {
      display: none; padding: 36px 24px; text-align: center;
    }
    .success-banner .s-emoji { font-size: 3rem; margin-bottom: 12px; }
    .success-banner h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
    .success-banner p { color: var(--text-sub); font-size: 0.88rem; margin-bottom: 20px; }
    .ghost-btn {
      padding: 12px 24px; border-radius: 12px;
      border: 1.5px solid var(--glass-border);
      background: rgba(255,255,255,0.09); color: #fff;
      font-family: inherit; font-weight: 600; font-size: 0.92rem;
      cursor: pointer; transition: background .15s;
    }
    .ghost-btn:hover { background: rgba(255,255,255,0.17); }

    @media (max-width: 480px) {
      header { padding: 14px 16px; }
      main { padding: 24px 12px 60px; }
      .title-card h1 { font-size: 1.35rem; }
      .card { padding: 18px 14px; }
      .theme-row { padding: 9px 10px; }
      .step-btn { width: 30px; height: 30px; }
      .num-input { width: 42px; height: 30px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<header>
  <img src="https://drk.qzz.io/newera/logo.png" alt="New Era Logo" onerror="this.style.display='none'" />
  <div class="brand">
    <span class="name">NEW ERA</span>
    <span class="sub">TEACHER · INTERNATIONAL COURSE VOTING</span>
  </div>
</header>

<main>
  <div class="glass-card title-card">
    <div class="week-label">Teacher · คุณครู</div>
    <h1>📋 International Course Voting<br/><span style="font-size:1.1rem;font-weight:400;color:rgba(255,255,255,0.65)">Enter vote counts by class</span></h1>
    <p>Select the class, then enter how many students voted for each theme.</p>
  </div>

  <div id="formSection">

    <!-- Class picker -->
    <div class="glass-card card">
      <span class="field-label">Level</span>
      <div class="pills" id="levelPills">
        <button class="pill big" data-level="K" type="button">K<small>Kindergarten</small></button>
        <button class="pill big" data-level="G" type="button">G<small>Grade</small></button>
      </div>

      <span class="field-label">Year (1–6)</span>
      <div class="pills" id="yearPills"></div>

      <span class="field-label">Room (1–6)</span>
      <div class="pills" id="roomPills"></div>

      <div class="class-badge" id="classBadge"></div>
    </div>

    <!-- Theme vote counts -->
    <div class="glass-card card">
      <span class="field-label">Votes per theme</span>
      <div id="themeList"></div>

      <div class="total-bar">
        <span>Total votes</span>
        <span class="total-num" id="totalNum">0</span>
      </div>

      <button class="submit-btn" id="submitBtn" type="button">✅ Submit</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>

  </div>

  <!-- Success -->
  <div class="glass-card success-banner" id="successBanner">
    <div class="s-emoji">🎉</div>
    <h2>Submitted!</h2>
    <p id="successText"></p>
    <button class="ghost-btn" id="againBtn" type="button">Submit another class</button>
  </div>
</main>

<script>
  // ── CONFIG ────────────────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://wtvtttmxkziresbjhhpy.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_K9isQRR9r8WzBm-o-mhsGA_B3zCF9O3';
  // ─────────────────────────────────────────────────────────────────────────

  const THEMES = [
    { emoji: '🏎️',  name: 'Racing Cars' },
    { emoji: '🎤',  name: 'K-pop' },
    { emoji: '🔥',  name: 'Free Fire' },
    { emoji: '🦕',  name: 'Dinosaurs' },
    { emoji: '🚗',  name: 'Cars' },
    { emoji: '🐉',  name: 'Dragon Ball' },
    { emoji: '🦸',  name: 'Superheroes' },
    { emoji: '👷',  name: 'Occupations' },
    { emoji: '👸',  name: 'Princes & Princesses' },
    { emoji: '🐘',  name: 'Animals' },
    { emoji: '🃏',  name: 'Alice in Wonderland' },
    { emoji: '🐠',  name: 'Under the Sea' },
    { emoji: '🚀',  name: 'Space Adventure' },
    { emoji: '🏴‍☠️', name: 'Pirates' },
    { emoji: '⛩️',  name: 'Anime' },
    { emoji: '🍄',  name: 'Super Mario' },
    { emoji: '🦁',  name: 'Zoo' },
    { emoji: '👻',  name: 'Ghosts' },
    { emoji: '🕸️',  name: 'Marvel' },
    { emoji: '⚽',  name: 'Sports' },
    { emoji: '🐦',  name: 'Bluey' },
    { emoji: '💍',  name: 'The Lord of the Rings' },
    { emoji: '🧟',  name: 'Zombies' },
    { emoji: '💥',  name: 'My Hero Academia' },
    { emoji: '🤖',  name: 'Doraemon' },
    { emoji: '🧙',  name: 'Fantasy' },
    { emoji: '🦄',  name: 'My Little Pony' },
    { emoji: '📖',  name: 'Manga & Manhwa (One Piece)' },
  ];

  const sel = { level: null, year: null, room: null };
  const counts = THEMES.map(() => 0);
  const steppers = []; // { set: fn }

  // ── Helpers ───────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);

  function showStatus(msg, isError = false) {
    const el = $('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg' + (isError ? ' error' : '');
  }

  const classReady = () => sel.level && sel.year && sel.room;
  const classKey   = () => `${sel.level}${sel.year}-${sel.room}`;
  const classLabel = () => `${sel.level}${sel.year} / Room ${sel.room}`;

  function updateTotal() {
    $('totalNum').textContent = counts.reduce((a, b) => a + b, 0);
  }

  function resetCounts() { steppers.forEach(s => s.set(0)); }

  // ── Build year & room pills ───────────────────────────────────────────────
  function buildNumberPills(containerId, key) {
    const box = $(containerId);
    for (let n = 1; n <= 6; n++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'pill'; b.textContent = n; b.dataset.val = n;
      b.addEventListener('click', () => { sel[key] = n; refreshPills(); onClassChange(); });
      box.appendChild(b);
    }
  }
  buildNumberPills('yearPills', 'year');
  buildNumberPills('roomPills', 'room');

  document.querySelectorAll('#levelPills .pill').forEach(b => {
    b.addEventListener('click', () => { sel.level = b.dataset.level; refreshPills(); onClassChange(); });
  });

  function refreshPills() {
    document.querySelectorAll('#levelPills .pill').forEach(b =>
      b.classList.toggle('selected', b.dataset.level === sel.level));
    document.querySelectorAll('#yearPills .pill').forEach(b =>
      b.classList.toggle('selected', +b.dataset.val === sel.year));
    document.querySelectorAll('#roomPills .pill').forEach(b =>
      b.classList.toggle('selected', +b.dataset.val === sel.room));
  }

  // ── Build theme rows ──────────────────────────────────────────────────────
  const themeList = $('themeList');

  THEMES.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'theme-row';

    // Name side
    const names = document.createElement('div');
    names.className = 'theme-names';
    const emoji = document.createElement('span'); emoji.className = 'theme-emoji'; emoji.textContent = t.emoji;
    const name  = document.createElement('span'); name.className  = 'theme-name';  name.textContent  = t.name;
    names.append(emoji, name);

    // Stepper
    const stepper = document.createElement('div');
    stepper.className = 'stepper';
    const minus = document.createElement('button'); minus.type = 'button'; minus.className = 'step-btn'; minus.textContent = '−';
    const input = document.createElement('input');
    input.type = 'number'; input.className = 'num-input';
    input.min = 0; input.max = 999; input.inputMode = 'numeric'; input.value = 0;
    const plus = document.createElement('button'); plus.type = 'button'; plus.className = 'step-btn'; plus.textContent = '+';
    stepper.append(minus, input, plus);

    const setVal = v => {
      v = Math.max(0, Math.min(999, parseInt(v, 10) || 0));
      counts[i] = v;
      input.value = v;
      row.classList.toggle('has-votes', v > 0);
      updateTotal();
    };

    minus.addEventListener('click', () => setVal(counts[i] - 1));
    plus.addEventListener('click',  () => setVal(counts[i] + 1));
    input.addEventListener('input', () => {
      const v = Math.max(0, Math.min(999, parseInt(input.value, 10) || 0));
      counts[i] = v;
      row.classList.toggle('has-votes', v > 0);
      updateTotal();
    });
    input.addEventListener('blur', () => setVal(input.value));
    input.addEventListener('focus', () => input.select());

    row.append(names, stepper);
    themeList.appendChild(row);
    steppers.push({ set: setVal });
  });

  // ── Class change: load existing entry if any ──────────────────────────────
  async function onClassChange() {
    const badge = $('classBadge');
    if (!classReady()) { badge.style.display = 'none'; return; }
    badge.style.display = 'block';
    badge.textContent = `Class ${classLabel()}`;
    showStatus('');

    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/teacher_counts?class_key=eq.${classKey()}&limit=1`,
        { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
      );
      const rows = await res.json();
      if (rows.length && rows[0].counts) {
        const saved = rows[0].counts;
        THEMES.forEach((_, i) => steppers[i].set(saved[i] || 0));
        showStatus('Previous entry loaded — submitting will replace it.');
      } else {
        resetCounts();
      }
    } catch (e) {
      console.error(e);
    }
  }

  // ── Submit ────────────────────────────────────────────────────────────────
  $('submitBtn').addEventListener('click', async () => {
    if (!classReady()) {
      showStatus('Please select Level, Year and Room.', true); return;
    }
    const total = counts.reduce((a, b) => a + b, 0);
    if (total === 0) {
      showStatus('Enter at least one vote count.', true); return;
    }

    const btn = $('submitBtn');
    btn.disabled = true;
    showStatus('Submitting…');

    try {
      const payload = {
        class_key: classKey(),
        level: sel.level,
        year: sel.year,
        room: sel.room,
        label: classLabel(),
        counts: [...counts],
        total,
        submitted_at: new Date().toISOString()
      };

      // Upsert — replace if this class key already exists
      const res = await fetch(`${SUPABASE_URL}/rest/v1/teacher_counts`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Prefer': 'resolution=merge-duplicates,return=minimal'
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `HTTP ${res.status}`);
      }

      $('formSection').style.display = 'none';
      $('successText').textContent = `${classLabel()} · ${total} vote${total !== 1 ? 's' : ''} recorded`;
      $('successBanner').style.display = 'block';

    } catch (e) {
      console.error(e);
      showStatus('Submit failed — ' + (e.message || 'unknown error'), true);
    }

    btn.disabled = false;
  });

  // ── Again ─────────────────────────────────────────────────────────────────
  $('againBtn').addEventListener('click', () => {
    sel.level = sel.year = sel.room = null;
    refreshPills();
    resetCounts();
    showStatus('');
    $('classBadge').style.display = 'none';
    $('successBanner').style.display = 'none';
    $('formSection').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
</body>
</html>
