<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BMO — Small. Stable. Yours.</title>
<style>
  :root{
    --yellow:#FFC93C;
    --yellow-light:#FFF6DD;
    --cream:#FFFDF6;
    --teal:#2FBFB6;
    --teal-dark:#0E6E68;
    --teal-deep:#0B4F4B;
    --coral:#FF6B5B;
    --navy:#23262B;
    --white:#FFFFFF;
    --line:#E3E0D6;
    font-size: 16px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background: var(--yellow);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--navy);
    overscroll-behavior: none;
  }

  h1,h2,h3,.serif{ font-family: Georgia, "Times New Roman", serif; }

  /* ---------- decorative background blobs ---------- */
  .blob{ position:fixed; border-radius:50%; background:#FFD666; z-index:0; }
  .blob.b1{ width:280px; height:280px; top:-120px; left:-100px; }
  .blob.b2{ width:340px; height:340px; bottom:-160px; right:-120px; }

  .app{
    position:relative; z-index:1;
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(16px, 3vw, 34px);
    min-height: 100%;
  }

  /* ---------- top masthead ---------- */
  .masthead{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-title{ font-size: clamp(22px, 3vw, 30px); font-weight:700; margin:0; }
  .brand-sub{ font-size: 13px; color: var(--teal-dark); font-weight:600; margin:2px 0 0; }
  .status{
    display:flex; align-items:center; gap:8px;
    background: var(--white); border-radius: 999px;
    padding: 8px 16px; font-weight:600; font-size:13px;
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:#4CAF50; }

  /* ---------- device shell ---------- */
  .device{
    background: var(--teal);
    border-radius: 30px;
    padding: 16px;
    box-shadow: 0 20px 40px rgba(11,79,75,.25);
    position:relative;
  }
  .device::before, .device::after{
    content:""; position:absolute; bottom:-16px; width:34px; height:30px;
    background: var(--teal-dark); border-radius: 0 0 16px 16px;
  }
  .device::before{ left:44px; }
  .device::after{ right:44px; }

  .screen{
    background: var(--white);
    border-radius: 20px;
    padding: clamp(14px, 2.2vw, 26px);
  }

  .screen-header{
    display:flex; align-items:center; gap:10px;
    font-weight:700; color: var(--teal-dark); font-size:14px;
    margin-bottom: 14px;
  }

  /* ---------- three-column board ---------- */
  .board{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    border:1.5px solid var(--line);
    border-radius: 12px;
    overflow:hidden;
  }
  .col{
    padding: 16px;
    border-right: 1.5px solid var(--line);
    display:flex; flex-direction:column;
    min-height: 230px;
  }
  .col:last-child{ border-right:none; }
  .col h3{
    margin:0 0 8px; font-size:16px; padding-bottom:8px;
    border-bottom: 2px solid var(--navy);
  }

  /* screen time */
  .st-total{ font-size:20px; font-weight:700; margin: 6px 0 14px; }
  .bars{ display:flex; align-items:flex-end; gap:8px; height:132px; }
  .bar-wrap{ display:flex; flex-direction:column; align-items:center; flex:1; justify-content:flex-end; height:100%; }
  .bar{
    width: 100%; max-width:26px; background: var(--yellow);
    border-radius: 5px 5px 3px 3px;
    transform-origin:bottom; animation: grow .7s ease-out both;
    flex:none;
  }
  @keyframes grow{ from{ transform: scaleY(0);} to{ transform: scaleY(1);} }
  .bar-label{ font-size:9px; color:#888; margin-top:5px; }

  /* notifications */
  .notif-list{ flex:1; overflow-y:auto; max-height:230px; padding-right:2px; }
  .notif-row{ font-size:12px; font-weight:700; color:#555; display:flex; align-items:center; gap:4px; margin:4px 0; }
  .bubble{
    background: var(--yellow-light); border-radius: 14px; padding:10px 12px;
    font-size:13px; margin: 4px 0 10px; display:flex; align-items:center;
    justify-content:space-between; gap:8px;
  }
  .bubble button{
    border:none; background:transparent; color:#999; font-size:14px;
    cursor:pointer; line-height:1; padding:2px 4px; border-radius:50%;
  }
  .bubble button:active{ background:#eee; }
  .ago{ font-size:11px; color:#999; margin: 6px 0; }
  .empty-note{ font-size:12px; color:#aaa; font-style:italic; margin-top:10px; }

  /* to-do */
  .todo-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 0; font-size:13.5px; gap:8px;
  }
  .todo-row.done span{ text-decoration: line-through; color:#aaa; }
  .check{
    width:24px; height:24px; border-radius:50%; border:2px solid var(--teal-dark);
    display:flex; align-items:center; justify-content:center; flex:none;
    cursor:pointer; font-size:12px; font-weight:700; color:#fff; background:#fff;
  }
  .check.on{ background:#8BC34A; border-color:#8BC34A; }
  .add-todo{
    display:flex; gap:6px; margin-top:auto; padding-top:10px;
  }
  .add-todo input{
    flex:1; border:1.5px solid var(--line); border-radius:8px; padding:8px 10px;
    font-size:13px; font-family:inherit;
  }
  .add-todo button{
    border:none; background: var(--teal); color:#fff; border-radius:8px;
    padding:0 14px; font-weight:700; font-size:16px; cursor:pointer;
  }
  .add-todo button:active{ background: var(--teal-dark); }

  /* ---------- badge + shortcuts row ---------- */
  .row2{
    display:flex; align-items:center; flex-wrap:wrap; gap:16px;
    margin-top: 20px;
  }
  .bmo-badge{
    background: var(--teal); color:#fff; font-weight:700; font-size:22px;
    padding: 16px 26px; border-radius: 16px; transform: rotate(-3deg);
    box-shadow: 0 6px 14px rgba(0,0,0,.12); border:none; cursor:pointer;
    font-family: Georgia, serif;
  }
  .bmo-badge:active{ transform: rotate(-3deg) scale(.96); }
  .shortcuts{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .shortcuts-label{ font-weight:700; font-size:14px; margin-right:2px; }
  .sc-btn{
    width:48px; height:48px; border-radius:50%; border:none;
    background: var(--yellow-light); font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .sc-btn:active{ background: var(--yellow); }

  /* ---------- bottom row ---------- */
  .row3{
    display:flex; gap:14px; margin-top:18px; flex-wrap:wrap;
  }
  .name-card{
    background: var(--yellow-light); border-radius:14px;
    padding: 12px 16px; display:flex; align-items:center; gap:10px;
    font-weight:700; font-size:14px; flex: 1 1 240px;
  }
  .name-card input{
    border:none; background:transparent; font-weight:700; font-size:14px;
    font-family:inherit; width:100%; outline:none; color:var(--navy);
    border-bottom: 1.5px dashed transparent;
  }
  .name-card input:focus{ border-bottom-color: var(--teal-dark); }
  .change-btn{
    border:none; background: var(--teal); color:#fff; border-radius:999px;
    padding:8px 16px; font-weight:700; font-size:12px; cursor:pointer; flex:none;
  }
  .change-btn:active{ background: var(--teal-dark); }

  .ready-btn{
    flex: 2 1 320px;
    border:none; border-radius:999px; background: var(--teal); color:#fff;
    font-weight:700; font-size:16px; font-family: Georgia, serif;
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding: 14px 20px; cursor:pointer;
  }
  .ready-btn:active{ background: var(--teal-dark); }

  footer{ text-align:center; color:#B98A1A; font-size:12px; margin-top:22px; }

  /* ---------- toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:26px; transform: translateX(-50%) translateY(20px);
    background: var(--navy); color:#fff; padding:12px 20px; border-radius:999px;
    font-size:13.5px; font-weight:600; opacity:0; pointer-events:none;
    transition: all .25s ease; z-index:50; max-width: 90vw; text-align:center;
  }
  #toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  /* ---------- chat drawer ---------- */
  #overlay{
    position:fixed; inset:0; background:rgba(11,79,75,.35);
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:40;
  }
  #overlay.show{ opacity:1; pointer-events:auto; }

  #chat{
    position:fixed; left:0; right:0; bottom:0;
    max-width: 620px; margin: 0 auto;
    background: var(--cream);
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -12px 40px rgba(0,0,0,.25);
    transform: translateY(105%);
    transition: transform .3s cubic-bezier(.2,.9,.3,1);
    z-index: 41;
    display:flex; flex-direction:column;
    height: min(78vh, 640px);
  }
  #chat.show{ transform: translateY(0); }

  .chat-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 18px 12px; border-bottom: 1.5px solid var(--line);
    flex:none;
  }
  .chat-head-left{ display:flex; align-items:center; gap:10px; }
  .chat-avatar{
    width:36px; height:36px; border-radius:50%; background:var(--teal);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700;
  }
  .chat-title{ font-weight:700; font-size:15px; }
  .chat-status{ font-size:11.5px; color: var(--teal-dark); font-weight:600; }
  .close-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:#EFEFEF;
    font-size:16px; cursor:pointer; color:#666;
  }
  .close-btn:active{ background:#e0e0e0; }

  .chat-body{
    flex:1; overflow-y:auto; padding: 16px 18px; display:flex; flex-direction:column; gap:10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg{ max-width: 78%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.4; }
  .msg.bot{ background:#fff; border:1.5px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px; }
  .msg.user{ background:var(--teal); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }

  .chat-suggest{ display:flex; gap:8px; flex-wrap:wrap; padding: 0 18px 10px; flex:none; }
  .sugg{
    border:1.5px solid var(--line); background:#fff; border-radius:999px;
    padding:7px 13px; font-size:12.5px; cursor:pointer; color:var(--teal-dark); font-weight:600;
  }
  .sugg:active{ background: var(--yellow-light); }

  .chat-input-row{
    display:flex; gap:8px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    border-top: 1.5px solid var(--line); flex:none; background:var(--cream);
  }
  .chat-input-row input{
    flex:1; border:1.5px solid var(--line); border-radius:999px;
    padding: 12px 16px; font-size:14px; font-family:inherit; outline:none;
  }
  .chat-input-row input:focus{ border-color: var(--teal); }
  .send-btn{
    width:44px; height:44px; border-radius:50%; border:none; background:var(--teal);
    color:#fff; font-size:18px; cursor:pointer; flex:none;
  }
  .send-btn:active{ background: var(--teal-dark); }

  /* ---------- settings popover ---------- */
  #settingsPop{
    position:fixed; z-index:45; background:#fff; border-radius:14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18); padding:14px 16px;
    width: 230px; display:none; font-size:13.5px;
  }
  #settingsPop.show{ display:block; }
  .setting-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; }
  .switch{ width:40px; height:22px; border-radius:999px; background:#ddd; position:relative; cursor:pointer; flex:none; }
  .switch.on{ background: var(--teal); }
  .switch::after{
    content:""; position:absolute; top:2px; left:2px; width:18px; height:18px;
    border-radius:50%; background:#fff; transition: left .15s ease;
  }
  .switch.on::after{ left:20px; }

  /* ---------- responsive ---------- */
  @media (max-width: 860px){
    .board{ grid-template-columns: 1fr; }
    .col{ border-right:none; border-bottom: 1.5px solid var(--line); min-height:auto; }
    .col:last-child{ border-bottom:none; }
  }
  @media (max-width: 560px){
    .row3{ flex-direction:column; }
    .change-btn{ flex:none; }
  }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="app">

  <div class="masthead">
    <div class="brand">
      <div>
        <h1 class="brand-title">BMO</h1>
        <p class="brand-sub">Small. Stable. Yours.</p>
      </div>
    </div>
    <div class="status"><span class="dot"></span><span id="clock">--:--</span></div>
  </div>

  <div class="device">
    <div class="screen">

      <div class="screen-header">⏱ <span id="fullTime">--:-- --</span> &nbsp;·&nbsp; Online</div>

      <div class="board">
        <!-- Screen Time -->
        <div class="col">
          <h3>Screen Time</h3>
          <div class="st-total">7h 36m</div>
          <div class="bars" id="bars"></div>
        </div>

        <!-- Notifications -->
        <div class="col">
          <h3>Notifications</h3>
          <div class="notif-list" id="notifList"></div>
        </div>

        <!-- To-do -->
        <div class="col">
          <h3>To-do List</h3>
          <div id="todoList"></div>
          <div class="add-todo">
            <input id="todoInput" type="text" placeholder="Add a task…" maxlength="40">
            <button id="addTodoBtn" aria-label="Add task">+</button>
          </div>
        </div>
      </div>

      <div class="row2">
        <button class="bmo-badge" id="badgeBtn">BMO</button>
        <div class="shortcuts">
          <span class="shortcuts-label">Shortcuts:</span>
          <button class="sc-btn" data-name="Themes" data-emoji="🎨">🎨</button>
          <button class="sc-btn" id="chatShortcut" data-name="Messages" data-emoji="💬">💬</button>
          <button class="sc-btn" id="settingsShortcut" data-name="Settings" data-emoji="⚙️">⚙️</button>
          <button class="sc-btn" data-name="Shortcuts editor" data-emoji="✂️">✂️</button>
          <button class="sc-btn" data-name="Camera" data-emoji="📷">📷</button>
          <button class="sc-btn" data-name="New shortcut" data-emoji="➕">➕</button>
        </div>
      </div>

      <div class="row3">
        <div class="name-card">
          <span>Name:</span>
          <input id="nameInput" type="text" value="Aethryxz" maxlength="20">
          <button class="change-btn" id="nameSaveBtn">Change</button>
        </div>
        <button class="ready-btn" id="readyBtn">👤 Ready to chat 💬</button>
      </div>

    </div>
  </div>

  <footer>BMO app preview — interactive concept · works fully offline</footer>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Settings popover -->
<div id="settingsPop">
  <div class="setting-row"><span>Notification sound</span><div class="switch on" id="swSound"></div></div>
  <div class="setting-row"><span>Screen-time limit</span><div class="switch" id="swLimit"></div></div>
  <div class="setting-row"><span>Dark mode</span><div class="switch" id="swDark"></div></div>
</div>

<!-- Chat overlay + drawer -->
<div id="overlay"></div>
<div id="chat" role="dialog" aria-label="Chat with BMO">
  <div class="chat-head">
    <div class="chat-head-left">
      <div class="chat-avatar">B</div>
      <div>
        <div class="chat-title">BMO</div>
        <div class="chat-status">Online · replies instantly</div>
      </div>
    </div>
    <button class="close-btn" id="closeChatBtn" aria-label="Close chat">✕</button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-suggest" id="chatSuggest">
    <button class="sugg">What's my screen time?</button>
    <button class="sugg">What's on my to-do list?</button>
    <button class="sugg">What time is it?</button>
    <button class="sugg">What can you do?</button>
  </div>
  <div class="chat-input-row">
    <input id="chatInput" type="text" placeholder="Ask BMO something…" autocomplete="off">
    <button class="send-btn" id="sendBtn" aria-label="Send">➤</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- state ---------------- */
  const store = {
    get(key, fallback){
      try{ const v = localStorage.getItem("bmo:"+key); return v===null ? fallback : JSON.parse(v); }
      catch(e){ return fallback; }
    },
    set(key, val){
      try{ localStorage.setItem("bmo:"+key, JSON.stringify(val)); }catch(e){}
    }
  };

  /* ---------------- toast ---------------- */
  let toastTimer = null;
  function toast(msg){
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> el.classList.remove("show"), 2200);
  }

  /* ---------------- clock ---------------- */
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function updateClock(){
    const d = new Date();
    let h = d.getHours(); const ampm = h>=12 ? "PM":"AM"; h = h%12; if(h===0) h=12;
    const timeStr = h+":"+pad(d.getMinutes())+" "+ampm;
    document.getElementById("clock").textContent = timeStr;
    document.getElementById("fullTime").textContent = timeStr;
  }
  updateClock(); setInterval(updateClock, 15000);

  /* ---------------- screen time bars ---------------- */
  const barData = [
    {label:"7am", h:22}, {label:"8am", h:40}, {label:"9am", h:14},
    {label:"10am", h:32}, {label:"11am", h:85}
  ];
  const barsEl = document.getElementById("bars");
  const MAX_BAR_PX = 100;
  barData.forEach((b,i)=>{
    const wrap = document.createElement("div"); wrap.className="bar-wrap";
    const bar = document.createElement("div"); bar.className="bar";
    bar.style.height = Math.round(b.h/100*MAX_BAR_PX) + "px";
    bar.style.animationDelay = (i*0.06)+"s";
    const label = document.createElement("div"); label.className="bar-label"; label.textContent = b.label;
    wrap.appendChild(bar); wrap.appendChild(label);
    barsEl.appendChild(wrap);
  });

  /* ---------------- notifications ---------------- */
  let notifs = store.get("notifs", [
    {id:1, text:"Hello! 👋", ago:"2H AGO"},
    {id:2, text:"Screen-time check-in ready", ago:"3H AGO"}
  ]);
  function renderNotifs(){
    const list = document.getElementById("notifList");
    list.innerHTML = "";
    const nowRow = document.createElement("div");
    nowRow.className = "notif-row"; nowRow.textContent = "Now ⌄";
    list.appendChild(nowRow);
    if(notifs.length === 0){
      const e = document.createElement("div"); e.className="empty-note"; e.textContent = "You're all caught up.";
      list.appendChild(e); return;
    }
    notifs.forEach(n=>{
      const bubble = document.createElement("div"); bubble.className = "bubble";
      const span = document.createElement("span"); span.textContent = "💬 " + n.text;
      const btn = document.createElement("button"); btn.textContent = "✕";
      btn.setAttribute("aria-label","Dismiss notification");
      btn.onclick = ()=>{ notifs = notifs.filter(x=>x.id!==n.id); store.set("notifs", notifs); renderNotifs(); };
      bubble.appendChild(span); bubble.appendChild(btn);
      list.appendChild(bubble);
      const ago = document.createElement("div"); ago.className="ago"; ago.textContent = n.ago + " ⌃";
      list.appendChild(ago);
    });
  }
  renderNotifs();

  /* ---------------- to-do list ---------------- */
  let todos = store.get("todos", [
    {id:1, text:"Edit video", done:true},
    {id:2, text:"Uploading…", done:false}
  ]);
  function renderTodos(){
    const list = document.getElementById("todoList");
    list.innerHTML = "";
    todos.forEach(t=>{
      const row = document.createElement("div"); row.className = "todo-row" + (t.done ? " done" : "");
      const span = document.createElement("span"); span.textContent = t.text;
      const check = document.createElement("div"); check.className = "check" + (t.done ? " on":"");
      check.textContent = t.done ? "✓" : "";
      check.onclick = ()=>{ t.done = !t.done; store.set("todos", todos); renderTodos(); };
      row.appendChild(span); row.appendChild(check);
      list.appendChild(row);
    });
  }
  renderTodos();

  document.getElementById("addTodoBtn").onclick = addTodo;
  document.getElementById("todoInput").addEventListener("keydown", e=>{ if(e.key==="Enter") addTodo(); });
  function addTodo(){
    const input = document.getElementById("todoInput");
    const val = input.value.trim();
    if(!val) return;
    todos.push({id: Date.now(), text: val, done:false});
    store.set("todos", todos);
    input.value = "";
    renderTodos();
  }

  /* ---------------- badge + shortcuts ---------------- */
  document.getElementById("badgeBtn").addEventListener("click", ()=>{
    const b = document.getElementById("badgeBtn");
    b.style.transform = "rotate(-3deg) scale(.9)";
    setTimeout(()=> b.style.transform = "rotate(-3deg)", 140);
    toast("Beep boop! I'm listening. 🤖");
  });

  document.querySelectorAll(".sc-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(btn.id === "chatShortcut"){ openChat(); return; }
      if(btn.id === "settingsShortcut"){ toggleSettings(btn); return; }
      toast(btn.dataset.emoji + " " + btn.dataset.name + " — coming soon");
    });
  });

  /* ---------------- settings popover ---------------- */
  const settingsPop = document.getElementById("settingsPop");
  function toggleSettings(anchor){
    if(settingsPop.classList.contains("show")){ settingsPop.classList.remove("show"); return; }
    const rect = anchor.getBoundingClientRect();
    let left = rect.left;
    if(left + 230 > window.innerWidth - 12) left = window.innerWidth - 242;
    settingsPop.style.left = left + "px";
    settingsPop.style.top = (rect.bottom + 10 + window.scrollY) + "px";
    settingsPop.classList.add("show");
  }
  document.addEventListener("click", (e)=>{
    if(!settingsPop.contains(e.target) && e.target.id !== "settingsShortcut"){
      settingsPop.classList.remove("show");
    }
  });
  [["swSound","sound"],["swLimit","limit"],["swDark","dark"]].forEach(([id,key])=>{
    const el = document.getElementById(id);
    let val = store.get("setting:"+key, id==="swSound");
    if(val) el.classList.add("on");
    el.addEventListener("click", ()=>{
      val = !val; el.classList.toggle("on", val); store.set("setting:"+key, val);
    });
  });

  /* ---------------- name / change ---------------- */
  const nameInput = document.getElementById("nameInput");
  nameInput.value = store.get("name", "Aethryxz");
  nameInput.readOnly = true;
  document.getElementById("nameSaveBtn").addEventListener("click", ()=>{
    const btn = document.getElementById("nameSaveBtn");
    if(nameInput.readOnly){
      nameInput.readOnly = false; nameInput.focus(); nameInput.select();
      btn.textContent = "Save";
    } else {
      nameInput.readOnly = true;
      const val = nameInput.value.trim() || "Aethryxz";
      nameInput.value = val;
      store.set("name", val);
      btn.textContent = "Change";
      toast("Name updated to " + val);
    }
  });

  /* ---------------- chat drawer open/close ---------------- */
  const overlay = document.getElementById("overlay");
  const chat = document.getElementById("chat");
  function openChat(){
    overlay.classList.add("show");
    chat.classList.add("show");
    setTimeout(()=> document.getElementById("chatInput").focus(), 300);
  }
  function closeChat(){
    overlay.classList.remove("show");
    chat.classList.remove("show");
  }
  document.getElementById("readyBtn").addEventListener("click", openChat);
  document.getElementById("closeChatBtn").addEventListener("click", closeChat);
  overlay.addEventListener("click", closeChat);

  /* ---------------- chat logic ---------------- */
  const chatBody = document.getElementById("chatBody");
  let chatHistory = store.get("chatHistory", null);

  function addMsg(text, who, save){
    const el = document.createElement("div");
    el.className = "msg " + who;
    el.textContent = text;
    chatBody.appendChild(el);
    chatBody.scrollTop = chatBody.scrollHeight;
    if(save !== false){
      chatHistory = chatHistory || [];
      chatHistory.push({text, who});
      store.set("chatHistory", chatHistory);
    }
  }

  if(chatHistory && chatHistory.length){
    chatHistory.forEach(m => addMsg(m.text, m.who, false));
  } else {
    addMsg("Hey! I'm BMO 👋 Ask me about the time, your screen time, or your to-do list.", "bot");
  }

  function safeMath(expr){
    if(!/^[0-9+\-*/().\s]+$/.test(expr)) return null;
    if(!/[0-9]/.test(expr)) return null;
    try{
      // eslint-disable-next-line no-new-func
      const result = Function('"use strict"; return (' + expr + ")")();
      if(typeof result === "number" && isFinite(result)) return result;
      return null;
    }catch(e){ return null; }
  }

  function respond(raw){
    const msg = raw.trim();
    const low = msg.toLowerCase();

    if(low === "") return "Ask me anything — try \"what time is it?\" or \"hello\".";

    if(/\b(hi|hello|hey|yo)\b/.test(low)){
      return "Hey there! How can I help today?";
    }
    if(/how are you/.test(low)){
      return "Running smoothly, thanks for asking! How are you?";
    }
    if(/(who are you|what are you)/.test(low)){
      return "I'm BMO — your small, stable AI companion.";
    }
    if(/what (can|do) you do/.test(low) || low === "help"){
      return "I can check the time, tell you your screen time, read your to-do list, or just chat. Try one of the suggestions below!";
    }
    if(/thank/.test(low)){
      return "You're welcome! 😊";
    }
    if(/\b(bye|goodbye|see ya|later)\b/.test(low)){
      return "See you soon!";
    }
    if(/screen ?time/.test(low)){
      return "You've spent 7h 36m on screen today — most of it around 11am.";
    }
    if(/what.*(date|day)/.test(low)){
      const d = new Date();
      const opts = { weekday:"long", month:"long", day:"numeric" };
      return "Today is " + d.toLocaleDateString(undefined, opts) + ".";
    }
    if(/what.*(time|clock)/.test(low)){
      const d = new Date();
      let h = d.getHours(); const ampm = h>=12 ? "PM":"AM"; h=h%12; if(h===0) h=12;
      return "It's " + h + ":" + pad(d.getMinutes()) + " " + ampm + " right now.";
    }
    if(/to[\s-]?do|task/.test(low)){
      if(!todos.length) return "Your to-do list is empty — nice and clear!";
      const lines = todos.map(t => (t.done ? "✓ " : "○ ") + t.text).join("\n");
      return "Here's your list:\n" + lines;
    }
    if(/notification/.test(low)){
      return notifs.length ? notifs.length + " notification(s) waiting for you." : "No new notifications — you're all caught up.";
    }
    if(/my name/.test(low)){
      return "You're " + (nameInput.value || "Aethryxz") + " — nice to chat with you.";
    }

    const mathMatch = msg.match(/-?\d+(?:\.\d+)?\s*[+\-*/]\s*-?\d+(?:\.\d+)?(?:\s*[+\-*/]\s*-?\d+(?:\.\d+)?)*/);
    if(mathMatch){
      const result = safeMath(mathMatch[0]);
      if(result !== null) return mathMatch[0].trim() + " = " + result;
    }

    return "I'm still learning that one! Try asking about the time, your screen time, or your to-do list.";
  }

  function sendMessage(text){
    if(!text.trim()) return;
    addMsg(text, "user");
    const input = document.getElementById("chatInput");
    input.value = "";
    setTimeout(()=>{
      addMsg(respond(text), "bot");
    }, 380);
  }

  document.getElementById("sendBtn").addEventListener("click", ()=>{
    sendMessage(document.getElementById("chatInput").value);
  });
  document.getElementById("chatInput").addEventListener("keydown", e=>{
    if(e.key === "Enter") sendMessage(e.target.value);
  });
  document.querySelectorAll(".sugg").forEach(btn=>{
    btn.addEventListener("click", ()=> sendMessage(btn.textContent));
  });

})();
</script>
</body>
</html>
