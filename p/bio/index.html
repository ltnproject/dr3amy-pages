<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links</title>
<style>
  body { margin:0; min-height:100vh; background:linear-gradient(180deg,#1a1220,#0b0b0e);
    color:#f3f1ea; font-family:ui-sans-serif,system-ui,sans-serif; display:flex; justify-content:center; padding:64px 20px; }
  .card { width:100%; max-width:420px; text-align:center; }
  .avatar { width:88px; height:88px; border-radius:50%; background:#d97757; margin:0 auto 16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .bio { opacity:.7; margin:0 0 32px; font-size:.95rem; }
  .link { display:block; padding:16px 20px; margin-bottom:12px; border-radius:14px;
    background:rgba(255,255,255,.06); color:inherit; text-decoration:none; font-weight:500;
    border:1px solid rgba(255,255,255,.08); }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar"></div>
    <h1>@yourname</h1>
    <p class="bio">One line about you</p>
    <a class="link" href="#">Website</a>
    <a class="link" href="#">Instagram</a>
    <a class="link" href="#">Twitter / X</a>
  </div>
</body>
</html>
