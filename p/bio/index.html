<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ltnproject</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:linear-gradient(180deg,#1a1220,#0b0b0e);
    color:#f1eefc; font-family:ui-sans-serif,system-ui,sans-serif;
    display:flex; justify-content:center; padding:64px 20px; }
  .card { width:100%; max-width:420px; text-align:center; }
  .avatar { width:88px; height:88px; border-radius:50%;
    background:linear-gradient(135deg,#a78bfa,#ff8fb1);
    margin:0 auto 16px; display:flex; align-items:center; justify-content:center;
    font-size:2rem; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .bio { opacity:.7; margin:0 0 32px; font-size:.95rem; }
  .link { display:block; padding:16px 20px; margin-bottom:12px; border-radius:14px;
    background:rgba(255,255,255,.06); color:inherit; text-decoration:none; font-weight:500;
    border:1px solid rgba(255,255,255,.08); transition:.15s ease; }
  .link:hover { background:rgba(255,255,255,.12); transform:translateY(-1px); }
  .footer { margin-top:40px; font-size:.75rem; opacity:.4; }
  .footer a { color:inherit; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">🌙</div>
    <h1>ltnproject</h1>
    <p class="bio">Building things on the internet</p>
    <a class="link" href="https://github.com/ltnproject">GitHub</a>
    <p class="footer">hosted on <a href="https://dr3amy.creepers.pro">Dr3amy Pages</a></p>
  </div>
</body>
</html>
