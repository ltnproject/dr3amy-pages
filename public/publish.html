
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <meta http-equiv="refresh" content="4;url=https://dr3amy.creepers.pro/dashboard.html">
  <title>Dream Ended — Dr3amy</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 35%, #31205a55, transparent 55%),
        #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      animation: appear 0.8s ease both;
    }

    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border: 1px solid #a78bfa44;
      border-radius: 22px;
      background: #a78bfa12;
      color: #c4b5fd;
      font-size: 30px;
      box-shadow: 0 0 45px #8b5cf622;
    }

    .label {
      margin-bottom: 16px;
      color: #a78bfa;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(30px, 7vw, 42px);
      font-weight: 750;
      letter-spacing: -1.8px;
      line-height: 1.15;
    }

    p {
      color: #a1a1aa;
      font-size: 15px;
      line-height: 1.8;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 32px;
      padding: 12px 17px;
      border: 1px solid #27272a;
      border-radius: 12px;
      background: #18181b99;
      color: #d4d4d8;
      font-size: 13px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: 0 0 12px #a78bfa;
      animation: pulse 1.4s infinite;
    }

    .progress {
      height: 3px;
      margin-top: 30px;
      overflow: hidden;
      border-radius: 5px;
      background: #27272a;
    }

    .bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #c4b5fd);
      animation: load 4s linear forwards;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      color: #c4b5fd;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }

    a:hover {
      color: white;
    }

    footer {
      margin-top: 64px;
      color: #52525b;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @keyframes load {
      to { width: 100%; }
    }

    @keyframes pulse {
      50% { opacity: 0.35; }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon">✦</div>

    <div class="label">Dr3amy · Notice</div>

    <h1>This dream has ended.</h1>

    <p>
      This dream is ended already, redirecting you to the new one.
      <br>
      A new chapter awaits.
    </p>

    <div class="status">
      <span class="dot"></span>
      Redirecting to the new dream...
    </div>

    <div class="progress">
      <div class="bar"></div>
    </div>

    <a href="https://dr3amy.creepers.pro/dashboard.html">
      Not redirected? Continue to Dr3amy →
    </a>

    <footer>STATIC, SMALL, YOURS.</footer>
  </main>

  <script>
    setTimeout(() => {
      window.location.replace(
        "https://dr3amy.creepers.pro/dashboard.html"
      );
    }, 4000);
  </script>
</body>
</html>
