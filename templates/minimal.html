<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled Page</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0b0e;
    color: #f3f1ea;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  main { max-width: 640px; padding: 48px 24px; text-align: center; }
  h1 { font-size: clamp(2rem, 6vw, 3.2rem); margin: 0 0 12px; letter-spacing: -0.02em; }
  p { font-size: 1.1rem; opacity: 0.7; line-height: 1.6; }
  a { color: #d97757; }
</style>
</head>
<body>
  <main>
    <h1>Your title here</h1>
    <p>Replace this text. Edit the HTML directly and hit publish — that's the whole workflow.</p>
  </main>
</body>
</html>
